name: Release

# Obsidian requires the release tag to exactly match manifest.json's version,
# so tags have no "v" prefix (e.g. "1.0.0", not "v1.0.0").
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: 'Tag name (e.g. 1.0.0) passed from tag-on-version-bump'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine tag version
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # inputs.tag and github.ref_name are bare versions like "1.0.0"
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '$RAW_TAG' is not a bare X.Y.Z version"
            exit 1
          fi
          echo "version=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "name=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify versions
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          MANIFEST_MIN=$(node -p "require('./manifest.json').minAppVersion")
          VERSIONS_MIN=$(node -p "require('./versions.json')['$MANIFEST_VERSION']")
          if [ "$MANIFEST_MIN" != "$VERSIONS_MIN" ]; then
            echo "ERROR: versions.json minAppVersion ($VERSIONS_MIN) does not match manifest.json minAppVersion ($MANIFEST_MIN) for version $MANIFEST_VERSION"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: manifest.json version ($MANIFEST_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      # Obsidian auto-reviews every release and silently pulls any that fails its
      # guideline scan. Run the same local gate (eslint-plugin-obsidianmd, #389)
      # here so a non-compliant release is never cut in the first place.
      - name: Lint (Obsidian review gate)
        run: npm run lint

      - name: Build
        run: node esbuild.config.mjs production

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
